# --- Prefix ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# --- Core behavior ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g history-limit 10000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# --- Ctrl+Backspace: send word-delete instead of raw ^H/^? ---
bind -n C-BSpace send-keys C-w

# --- Splits (open in cwd) ---
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- Pane navigation (vim-tmux-navigator handles nvim passthrough) ---
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# --- Pane resize ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Window navigation ---
bind -n S-Left previous-window
bind -n S-Right next-window

# --- Quit ---
bind q kill-session

# --- Session switcher (sesh) ---
bind-key -N "sesh" f run-shell "sesh connect \"$(
  sesh list --icons -t | fzf-tmux -p 55%,60% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list --icons -t)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list --icons -c)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list --icons -z)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .git . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# --- Last session (survives logout/reboot; ignores "default") ---
set-hook -g client-session-changed 'run-shell -b "[ \"#{session_name}\" = default ] || { mkdir -p ~/.local/state/tmux && echo \"#{session_name}\" > ~/.local/state/tmux/last-session; }"'
set-hook -g client-attached 'run-shell -b "[ \"#{session_name}\" = default ] || { mkdir -p ~/.local/state/tmux && echo \"#{session_name}\" > ~/.local/state/tmux/last-session; }"'
bind-key -N "session tree" S choose-tree -Zs
bind-key -N "last session" s run-shell 's=$(cat ~/.local/state/tmux/last-session 2>/dev/null); [ -n "$s" ] && tmux has-session -t "=$s" 2>/dev/null && tmux switch-client -t "=$s" || tmux display "no last session"'

# --- Copy mode (vi) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "tmux save-buffer - | xclip -i -sel clipboard"

# --- Status bar (calm-blue accent) ---
set -g status-style "bg=#0a0e1a,fg=#cddcff"
set -g status-left ""
set -g status-right "#[fg=#5c7fff]#S"
setw -g window-status-current-style "fg=#5c7fff,bold"
setw -g window-status-style "fg=#2c3a5c"
set -g pane-active-border-style "fg=#5c7fff"
set -g pane-border-style "fg=#2c3a5c"

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @resurrect-restore 'R'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes '~nvim ~claude'

run '~/.tmux/plugins/tpm/tpm'
